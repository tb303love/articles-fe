<div class="bundle-components-section mt-3">
  <div class="header">
    <h4><mat-icon>layers</mat-icon> Sastav paketa</h4>
    <button mat-icon-button color="primary" type="button" (click)="addComponent()" [disabled]="components()().invalid()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
  @if (components().length > 0) {
    <div class="components-list mt-2">
      @for (cmp of components(); track $index) {
        <div class="component-row">
          <mat-form-field appearance="outline" class="flex-grow">
            <input matInput [formField]="cmp.name" [matAutocomplete]="autoComp" placeholder="Izaberi artikal"
                   (focus)="searchComponents($index, cmp.name().value())"
                   (input)="searchComponents($index, $any($event.target).value)"/>
            <mat-autocomplete #autoComp="matAutocomplete" (optionSelected)="onSelected($event, $index)">
              @for (art of suggestions()[$index] ?? []; track art.id) {
                <mat-option [value]="art.name">
                  <span>{{ art.name }}</span> Komada: <span>{{ art.totalStock }}</span>
                </mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
          <mat-form-field appearance="outline" class="small-field">
            <input matInput type="number" [formField]="cmp.quantity"/>
            @if (cmp.quantity().getError('max')) {
              <mat-error>Maksimum je predjen</mat-error>
            }
          </mat-form-field>
          <button mat-icon-button color="warn" type="button" (click)="removeComponent($index)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
